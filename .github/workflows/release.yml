name: Release

# Cut a release by pushing a version tag:
#   git tag v0.1.0 && git push origin v0.1.0
# The tag is the source of truth for the version; the build number is the commit
# count (monotonic, so Sparkle always sees a higher CFBundleVersion). The DMG and
# appcast.xml are attached to the GitHub Release; the app's SUFeedURL points at
# releases/latest/download/appcast.xml, which always serves the newest release's
# copy. See docs/RELEASING.md for the required secrets.
on:
  push:
    tags:
      - "v*"

concurrency:
  group: release
  cancel-in-progress: false

env:
  APP_NAME: ForgeLoop
  SPARKLE_VERSION: "2.8.0"

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      # Full history so the commit count (build number) works.
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Derive version and build number
        id: meta
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not derive a version from tag '$GITHUB_REF_NAME'"
            exit 1
          fi
          BUILD_NUMBER=$(git rev-list --count HEAD)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Releasing v$VERSION (build $BUILD_NUMBER)"

      # Import the Developer ID Application certificate into a throwaway keychain.
      - name: Import signing certificate
        env:
          DEVELOPER_ID_CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"

          echo "$DEVELOPER_ID_CERT_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$DEVELOPER_ID_CERT_PASSWORD" \
            -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

      # build-app.sh embeds + signs Sparkle and Developer-ID-signs the universal
      # bundle with the hardened runtime and a secure timestamp, so the output is
      # ready to notarize. SIGN_IDENTITY is matched by name against the imported
      # certificate.
      - name: Build signed app bundle
        env:
          SIGN_IDENTITY: "Developer ID Application"
          FORGELOOP_VERSION: ${{ steps.meta.outputs.version }}
          FORGELOOP_BUILD: ${{ steps.meta.outputs.build }}
        run: ./Scripts/build-app.sh

      # hdiutil only — no create-dmg dependency. The DMG gets a plain window with
      # the app and an /Applications drop link.
      - name: Create DMG
        run: |
          STAGING="$RUNNER_TEMP/dmg-staging"
          mkdir -p "$STAGING"
          cp -R "$PWD/${APP_NAME}.app" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"
          DMG_PATH="$RUNNER_TEMP/${APP_NAME}.dmg"
          hdiutil create -volname "$APP_NAME" -srcfolder "$STAGING" \
            -ov -format UDZO "$DMG_PATH"
          echo "DMG_PATH=$DMG_PATH" >> "$GITHUB_ENV"

      # Notarize + staple the DMG. The app inside is already Developer-ID-signed
      # with the hardened runtime and a secure timestamp, which notarization needs.
      - name: Notarize and staple DMG
        env:
          ASC_API_KEY: ${{ secrets.ASC_API_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          ASC_KEY_PATH="$RUNNER_TEMP/asc_api_key.p8"
          echo "$ASC_API_KEY" | base64 --decode > "$ASC_KEY_PATH"

          xcrun notarytool submit "$DMG_PATH" \
            --key "$ASC_KEY_PATH" \
            --key-id "$ASC_KEY_ID" \
            --issuer "$ASC_ISSUER_ID" \
            --wait

          xcrun stapler staple "$DMG_PATH"

      - name: Install Sparkle tools
        run: |
          curl -sL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            | tar xJ -C "$RUNNER_TEMP" bin/sign_update bin/generate_appcast
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      # generate_appcast reads the version from the app inside the DMG, signs the
      # DMG with the EdDSA private key, and writes appcast.xml next to it. Fetch
      # the previous appcast (if any) so history is MERGED rather than restarted.
      - name: Generate appcast
        env:
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          APPCAST_DIR="$RUNNER_TEMP/appcast_dir"
          mkdir -p "$APPCAST_DIR"

          gh release download latest \
            --pattern "appcast.xml" \
            --dir "$APPCAST_DIR" \
            --clobber 2>/dev/null \
            || echo "::notice::No previous appcast.xml — generating fresh history"

          cp "$DMG_PATH" "$APPCAST_DIR/"

          echo "$SPARKLE_ED_KEY" | generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/" \
            "$APPCAST_DIR"

          cp "$APPCAST_DIR/appcast.xml" "$RUNNER_TEMP/appcast.xml"

      # Attach both artifacts to the release. Because SUFeedURL points at
      # releases/latest/download/appcast.xml, overwriting the asset on the newest
      # release is what publishes the update feed.
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ steps.meta.outputs.version }}"
          gh release create "v${VERSION}" \
            --title "${APP_NAME} v${VERSION}" \
            --generate-notes \
            "$DMG_PATH#${APP_NAME}-${VERSION}.dmg" \
            "$RUNNER_TEMP/appcast.xml#appcast.xml"

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
